<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briefly — NLP Summarizer</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app">

    <div class="header">
      <h1>Brief<em>ly</em></h1>
      <p>Paste long text or upload a video — get an instant, intelligent recap</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-text">
        <span class="tab-icon">📝</span> Text input
      </button>
      <button class="tab-btn" id="tab-video">
        <span class="tab-icon">🎬</span> Video file
      </button>
    </div>

    <!-- Text Panel -->
    <div id="panel-text" class="panel active">
      <div class="input-card">
        <label>Paste your text</label>
        <textarea id="text-input" placeholder="Paste text here…"></textarea>
        <div class="char-count">
          <span id="char-count">0</span> characters · <span id="word-count">0</span> words
        </div>
      </div>
    </div>

    <!-- Video Panel -->
    <div id="panel-video" class="panel">
      <div class="input-card">
        <label>Upload video file</label>

        <div class="upload-zone" id="upload-zone">
          <div class="upload-icon">🎬</div>
          <p><strong>Click to upload</strong> or drag & drop</p>
          <input type="file" id="file-input" accept="video/*" />
        </div>

        <div class="file-info" id="file-info">
          <span>🎬</span>
          <span id="file-name"></span>
          <span id="file-size"></span>
          <button class="file-remove">✕</button>
        </div>

      </div>
    </div>

    <!-- Options -->
    <div class="options-row">
      <select id="style-select">
        <option value="concise">Concise</option>
        <option value="bullet">Bullet</option>
      </select>

      <select id="length-select">
        <option value="short">Short</option>
        <option value="medium">Medium</option>
      </select>
    </div>

    <button class="btn-summarize" id="btn-summarize">
      <span id="btn-text">✦ Summarize now</span>
    </button>

    <div id="error-box"></div>

    <div id="result-section">
      <div id="result-text"></div>
      <button id="copy-btn">Copy</button>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
